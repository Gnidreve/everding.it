name: Build APK (manual, native Gradle)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build APK (debug-signiert, Wegwerfprojekt)
        run: gradle :app:assembleRelease

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new latest release
        run: |
          gh release create latest \
            app/build/outputs/apk/release/app-release.apk \
            --title "Notizblock – Latest Build" \
            --notes "Build ${{ github.run_number }} — Commit ${{ github.sha }} — $(date +'%d.%m.%Y %H:%M')" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
